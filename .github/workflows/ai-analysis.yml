name: AI Analysis

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-core.txt
      - name: Verify Supabase secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SECRET_KEY }}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_SECRET_KEY. Run: python scripts/sync_github_secrets.py"
            exit 1
          fi
      - run: python scripts/run_ai_analysis.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_DAILY_CLOUD_CALL_LIMIT: ${{ vars.AI_DAILY_CLOUD_CALL_LIMIT || '200' }}
          OLLAMA_ENABLED: "false"
